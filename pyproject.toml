[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "industrial-defect-inspection"
version = "0.1.0"
description = "Reproducible industrial surface-defect detection with YOLO, ONNX, FastAPI, and Gradio."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "5dawn", email = "94522153+5dawn@users.noreply.github.com" }]
keywords = ["computer-vision", "object-detection", "industrial-inspection", "yolo", "onnx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: GNU Affero General Public License v3",
]
dependencies = [
  "fastapi>=0.115,<1",
  "gradio>=5.0,<7",
  "numpy>=1.26,<3",
  "onnx>=1.16,<2",
  "onnxruntime>=1.18,<2",
  "pillow>=10.3,<13",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6.0,<7",
  "torch>=2.3,<3",
  "ultralytics>=8.4.0,<9",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
idi-prepare = "industrial_defect_inspection.data.prepare:main"
idi-train = "industrial_defect_inspection.training.train:main"
idi-evaluate = "industrial_defect_inspection.evaluation.evaluate:main"
idi-export = "industrial_defect_inspection.inference.export:main"
idi-predict = "industrial_defect_inspection.inference.predict:main"
idi-web = "industrial_defect_inspection.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_defect_inspection"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["integration: tests requiring optional web or model dependencies"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
